[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcrew-example-entry-point-plugin"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."agentcrew.plugins"]
entry-point-example = "agentcrew_example_plugin:EntryPointExamplePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrew_example_plugin"]
